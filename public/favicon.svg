<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D5A3" />
      <stop offset="50%" stop-color="#D49841" />
      <stop offset="100%" stop-color="#9E5F3D" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2824" />
      <stop offset="100%" stop-color="#181513" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Luxury Rounded Square -->
  <rect width="100" height="100" rx="26" fill="url(#bgGrad)" />
  <rect x="3" y="3" width="94" height="94" rx="23" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.8" />

  <!-- Crown / Tiara Ornament at the top -->
  <path d="M36 32 L43 38 L50 26 L57 38 L64 32 L62 44 L38 44 Z" fill="url(#goldGrad)" />
  <circle cx="50" cy="24" r="2.5" fill="#FFF2D6" />
  <circle cx="36" cy="30" r="2" fill="#FFF2D6" />
  <circle cx="64" cy="30" r="2" fill="#FFF2D6" />

  <!-- Stylized Elegant 'K' Monogram for Karni -->
  <path d="M38 44 L38 78 M38 61 L60 44 M47 54 L63 78" 
        stroke="url(#goldGrad)" 
        stroke-width="6.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Sparkling Diamond Glow -->
  <path d="M74 34 Q74 42 79 42 Q74 42 74 50 Q74 42 69 42 Q74 42 74 34 Z" fill="#FFF6E5" filter="url(#glow)" />
  <circle cx="74" cy="42" r="1.5" fill="#FFFFFF" />
</svg>
